name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable pinned Yarn
        run: corepack enable

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.8
          cache: true

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Lint frontend
        run: yarn lint

      - name: Type-check frontend
        run: yarn typecheck

      - name: Test frontend
        run: yarn test:ci

      - name: Build frontend
        run: yarn build

      - name: Check backend formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files are not formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet backend
        run: go vet ./...

      - name: Test backend with race detector
        run: go test -race ./...

      - name: Build backend targets
        run: go run github.com/magefile/mage@v1.15.0 -v buildAll

      - name: Scan backend dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Validate assembled plugin metadata
        run: bash scripts/check-plugin-metadata.sh dist/plugin.json

      - name: Package plugin for validation
        run: bash scripts/package-plugin.sh "$(jq -r .version package.json)"

      - name: Run Grafana plugin validator
        run: |
          version="$(jq -r .version package.json)"
          go run github.com/grafana/plugin-validator/pkg/cmd/plugincheck2@v0.41.0 \
            "release/rajsameer-vertica-datasource-$version.zip"
