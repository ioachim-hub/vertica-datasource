name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to package without the leading v
        required: false
        default: 2.0.9
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve release version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            release_version="${GITHUB_REF_NAME#v}"
          else
            release_version="${DISPATCH_VERSION:-2.0.9}"
          fi
          bash scripts/check-semver.sh "$release_version"
          echo "RELEASE_VERSION=$release_version" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Enable pinned Yarn
        run: corepack enable

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.8
          cache: true

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile

      - name: Lint frontend
        run: yarn lint

      - name: Type-check frontend
        run: yarn typecheck

      - name: Test frontend
        run: yarn test:ci

      - name: Build frontend
        run: yarn build

      - name: Check backend formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "The following Go files are not formatted:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Vet backend
        run: go vet ./...

      - name: Test backend with race detector
        run: go test -race ./...

      - name: Build backend targets
        run: go run github.com/magefile/mage@v1.15.0 -v buildAll

      - name: Scan backend dependencies
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Validate assembled plugin metadata
        run: bash scripts/check-plugin-metadata.sh dist/plugin.json

      - name: Check package version
        run: bash scripts/check-version.sh "$RELEASE_VERSION"

      - name: Extract matching release notes
        run: |
          changelog_version="${RELEASE_VERSION#v}"
          awk -v version="$changelog_version" '
            /^##[[:space:]]+/ {
              if (found) {
                exit
              }
              heading = $0
              sub(/^##[[:space:]]+/, "", heading)
              sub(/[[:space:]].*$/, "", heading)
              sub(/^\[/, "", heading)
              sub(/\]$/, "", heading)
              sub(/^v/, "", heading)
              if (heading == version) {
                found = 1
                print
              }
              next
            }
            found {
              print
            }
            END {
              if (!found) {
                printf "CHANGELOG.md has no section for %s\n", version > "/dev/stderr"
                exit 1
              }
            }
          ' CHANGELOG.md > release-notes.md

      - name: Package plugin
        run: bash scripts/package-plugin.sh "$RELEASE_VERSION"

      - name: Verify release artifacts
        run: |
          version="${RELEASE_VERSION#v}"
          plugin_id="rajsameer-vertica-datasource"
          archive="$plugin_id-$version.zip"
          (
            cd release
            sha256sum -c "$archive.sha256"
            unzip -t "$archive"
          )
          entries="$(unzip -Z1 "release/$archive")"
          printf '%s\n' "$entries" | awk -F/ -v plugin_id="$plugin_id" '
            BEGIN {
              valid = 1
            }
            $1 != plugin_id {
              valid = 0
            }
            END {
              exit !(NR > 0 && valid != 0)
            }
          '
          printf '%s\n' "$entries" | grep -Fx "$plugin_id/plugin.json" >/dev/null
          printf '%s\n' "$entries" | grep -Fx "$plugin_id/module.js" >/dev/null
          zipinfo -l "release/$archive" | awk -v plugin_id="$plugin_id" '
            $NF ~ ("^" plugin_id "/gpx_vertica-datasource") {
              count++
              if ($1 !~ /^-rwxr-xr-x/) {
                printf "Backend executable has unexpected mode: %s %s\n", $1, $NF > "/dev/stderr"
                invalid = 1
              }
            }
            END {
              if (count != 6) {
                printf "Expected 6 backend executables, found %d\n", count > "/dev/stderr"
                invalid = 1
              }
              exit invalid
            }
          '

      - name: Run Grafana plugin validator
        run: |
          version="${RELEASE_VERSION#v}"
          go run github.com/grafana/plugin-validator/pkg/cmd/plugincheck2@v0.41.0 \
            "release/rajsameer-vertica-datasource-$version.zip"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin-release
          path: |
            release/*
            release-notes.md
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plugin-release

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
